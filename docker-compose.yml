version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: brewlite_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-brewlite}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-brewlite_password}
      POSTGRES_DB: ${DB_NAME:-brewlite_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - brewlite_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brewlite_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-4000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-brewlite}
      DB_PASSWORD: ${DB_PASSWORD:-brewlite_password}
      DB_NAME: ${DB_NAME:-brewlite_db}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      - postgres
    networks:
      - brewlite_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brewlite_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - brewlite_network

volumes:
  postgres_data:
    driver: local

networks:
  brewlite_network:
    driver: bridge

