  <path d="M66 85 L68 165 Q70 172 80 172 L120 172 Q130 172 132 165 L134 85 Z" fill="#2E1B15"/>
  <!-- Cold Brew Deep Amber Reflection -->
  <path d="M72 100 L74 160 Q76 166 84 166 L116 166 Q124 166 126 160 L128 100 Z" fill="#42251D" opacity="0.7"/>
  <!-- Ice Cubes inside Cold Brew -->
  <rect x="76" y="110" width="22" height="22" rx="4" fill="#FFFFFF" opacity="0.35" transform="rotate(-6 87 121)"/>
  <rect x="102" y="125" width="20" height="20" rx="4" fill="#FFFFFF" opacity="0.35" transform="rotate(8 112 135)"/>
  <rect x="85" y="135" width="18" height="18" rx="3" fill="#FFFFFF" opacity="0.3"/>
  <!-- Thick Salted Cream / Macchiato Foam Layer (Top) -->
  <path d="M63 50 L66 88 Q100 95 134 88 L137 50 Z" fill="#FFFBF2"/>
