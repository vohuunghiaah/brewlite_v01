  <ellipse cx="100" cy="50" rx="37" ry="9" fill="#FFFDF8" stroke="#F1EAD8" stroke-width="2"/>
  <!-- Sea Salt Flakes & Caramel Dusting on Top -->
  <circle cx="88" cy="48" r="1.5" fill="#C29D59"/>
  <circle cx="96" cy="52" r="2" fill="#D4AF37"/>
  <circle cx="108" cy="47" r="1.5" fill="#C29D59"/>
  <circle cx="115" cy="51" r="1.2" fill="#E2C98A"/>
  <circle cx="102" cy="46" r="1.8" fill="#FFFFFF"/>
  <circle cx="92" cy="53" r="1.2" fill="#FFFFFF"/>
  <!-- Straw -->
  <line x1="126" y1="20" x2="108" y2="155" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
</svg>
